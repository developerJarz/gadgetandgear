<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ggGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="64" height="64" rx="16" fill="#0B0F19" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#ggGrad)" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Ambient Glow -->
  <circle cx="32" cy="32" r="18" fill="url(#glowGrad)" filter="url(#glow)" opacity="0.4" />

  <!-- Gear & Tech Motif with Stylized 'G' -->
  <g transform="translate(12, 12)" filter="url(#glow)">
    <!-- Stylized G1 Shape -->
    <path d="M22 6C14.268 6 8 12.268 8 20C8 27.732 14.268 34 22 34C28.2 34 33.4 29.9 35.2 24.2H21.5V18.5H40C40.3 19.8 40.5 21.1 40.5 22.5C40.5 32.7 32.2 41 22 41C10.4 41 1 31.6 1 20C1 8.4 10.4 -1 22 -1C27.5 -1 32.5 1.1 36.2 4.7L31.2 9.5C28.8 7.3 25.6 6 22 6Z" fill="url(#ggGrad)" transform="scale(0.85) translate(2, 2)" />
    
    <!-- Lightning Bolt Accent -->
    <path d="M24 8L16 20H23L21 31L31 18H23L26 8H24Z" fill="#FFFFFF" />
